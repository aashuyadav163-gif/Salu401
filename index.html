<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Buggi ka b'day </title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Heart Floating Animation Background -->
    <div class="hearts-bg"></div>
    <div class="container">
        <h1>Happy Birthday Buggi &#128541 </h1>
        <!-- Animated Wish -->
        <p id="wish" class="animated-wish">
            You mean the world to me. Wishing you a magical birthday filled with joy, love, and sweet surprises!
        </p>

        <!-- Shift Photos Button -->
        <button id="shiftBtn" onclick="showPhotos()">Touch Karoo Naa</button>

        <!-- Photo Gallery -->
        <div id="photoGallery" class="photo-gallery" style="display:none;">
            <img src="panda2.webp" alt="Photo 1" />
            <img src="panda1.webp" alt="Photo 2" />
            <img src="panda3.jpg" alt="Photo 3" />
            <img src="panda2.webp" alt="Photo 4" />
            <img src="panda3.jpg" alt="Photo 5" />
        </div>
        

         <!-- YouTube Video Embed -->
        <div class="video-container">
            <iframe width="360" height="215" 
                src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="love-message">
            <span>❤</span> You’re the reason my heart beats. <span>❤</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
